[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
debug = 1

[package]
name = "spotiqueue_worker"
version = "0.2.0"
authors = ["paul <423357+toothbrush@users.noreply.github.com>"]
edition = "2021"

[build-dependencies]
cbindgen = "0.29.2"

[dependencies]
env_logger = "0.11.8"
log = "0.4.28"
once_cell = "1.21.3"
reqwest = { version = "0.12", features = ["blocking"] }
rodio = "0.20"
strum = { version = "0.27", features = ["derive"] }
tidalrs = "0.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
